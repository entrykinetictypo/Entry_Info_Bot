name: One-time public API diagnostics
on:
  push:
    paths:
      - .github/workflows/api-diagnostics.yml
      - tests/api-diagnostics.mjs
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/api-diagnostics.mjs
