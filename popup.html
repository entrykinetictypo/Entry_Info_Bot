<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entry Info Bot</title>
  <link rel="stylesheet" href="popup.css">
  <script src="src/popup.js" defer></script>
</head>
<body>
  <main>
    <header>
      <span class="brand">🤖</span>
      <div>
        <h1>Entry Info Bot</h1>
        <p>엔트리 이야기 유저 정보 봇 <span class="version">v0.2.0</span></p>
      </div>
    </header>

    <section class="panel">
      <div class="switch-line">
        <div>
          <label for="botEnabled" class="heading">자동 댓글 봇 실행</label>
          <p>다른 사람이 새 글에 명령어를 쓰면 그 글에 댓글을 작성합니다.</p>
        </div>
        <input type="checkbox" id="botEnabled" aria-label="봇 활성화">
      </div>
      <p id="status" class="status" role="status">상태를 확인하는 중...</p>
    </section>

    <section class="panel">
      <h2>닉네임 조회 테스트</h2>
      <p>이 기능은 확인용입니다. 자동 댓글은 위의 스위치를 켜면 실행됩니다.</p>
      <div class="test-row">
        <input id="nickname" type="text" placeholder="예: 12옴" maxlength="40" autocomplete="off" aria-label="테스트할 닉네임">
        <button id="testBtn" type="button">조회</button>
      </div>
      <pre id="testResult" aria-live="polite">!'12옴'정보</pre>
    </section>

    <section class="panel">
      <div class="split">
        <h2>작동 기록</h2>
        <button id="clearLog" class="text-button" type="button">기록 지우기</button>
      </div>
      <div id="logs" class="log-list">아직 기록이 없습니다.</div>
    </section>
    <footer>브라우저 실행 중 · 엔트리 이야기 탭을 열어 두세요<br>30초 간격 감지 · 시간당 댓글 최대 10회<br>비공식 도구입니다. 엔트리 운영 정책을 지켜 주세요.</footer>
  </main>
</body>
</html>
